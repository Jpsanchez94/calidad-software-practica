name: Prueba real de arranque Android
on:
  push:
    branches:
      - apk-doble-evidencia-gps-20261025
    paths:
      - "DobleEvidenciaGPS/**"
      - ".github/workflows/doble-evidencia-smoke.yml"
  workflow_dispatch:
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compilar proyecto para prueba
        working-directory: DobleEvidenciaGPS
        run: gradle --no-daemon :app:assembleDebug
      - name: Habilitar aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar y abrir app en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: |
            set -eu
            adb install -r DobleEvidenciaGPS/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.evidencia.doblegps android.permission.CAMERA
            adb shell pm grant com.evidencia.doblegps android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant com.evidencia.doblegps android.permission.ACCESS_COARSE_LOCATION
            adb logcat -c
            adb shell am start -n com.evidencia.doblegps/.MainActivity
            sleep 12
            echo "PROCESO APP:"
            adb shell pidof com.evidencia.doblegps
            adb logcat -d -b crash > /tmp/evidencia-crash.txt
            if grep -A 15 -B 2 'FATAL EXCEPTION' /tmp/evidencia-crash.txt | grep -q 'com.evidencia.doblegps'; then
              cat /tmp/evidencia-crash.txt
              exit 1
            fi
            echo 'SMOKE TEST OK: la aplicación continúa abierta'
