name: APK Doble Evidencia GPS
on:
  push:
    branches:
      - apk-doble-evidencia-gps-20261025
    paths:
      - "DobleEvidenciaGPS/**"
      - ".github/workflows/build-doble-evidencia-gps.yml"
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: DobleEvidenciaGPS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Usar SDK Android del runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -ld "$ANDROID_HOME/platforms/"* "$ANDROID_HOME/build-tools/"* || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compilar APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DobleEvidenciaGPS-APK
          path: DobleEvidenciaGPS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error