name: APK Doble Evidencia GPS
on:
  push:
    branches:
      - apk-doble-evidencia-gps-20261025
    paths:
      - "DobleEvidenciaGPS/**"
      - ".github/workflows/build-doble-evidencia-gps.yml"
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: DobleEvidenciaGPS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compilar APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DobleEvidenciaGPS-APK
          path: DobleEvidenciaGPS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error